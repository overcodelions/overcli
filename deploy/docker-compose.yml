# One overcli for the org. `docker compose -f deploy/docker-compose.yml up -d`
# after filling in deploy/.env (see deploy/README.md).
services:
  overcli:
    # The published image; pin a minor version (OVERCLI_VERSION=0.22 in .env)
    # to take fixes without surprises. Upgrade: change it, then
    # `docker compose pull && docker compose up -d`. To run your own build
    # instead, replace `image:` with
    #   build: { context: .., dockerfile: deploy/Dockerfile }
    image: ghcr.io/overcodelions/overcli-server:${OVERCLI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    # The server still runs as `node`. Starting as root lets the entrypoint
    # give it leave to run workers (and repo tests) as another user, and
    # nothing more. See deploy/docs/security.md.
    user: "0"
    environment:
      OVERCLI_SLACK_ENABLED: "1"
      # Goes with the loopback port below: browsers on this host reach the
      # container from Docker's gateway, so tell it they're local and it takes
      # passwords over plain http. Remove it if you open the port up.
      OVERCLI_PUBLISHED_ON_LOOPBACK: "1"
      # Workers run as user 1001, which can't read the server's secrets; the
      # server checks that at every start. Set OVERCLI_WORKER_UID= (empty) in
      # .env to run them as the server instead.
      OVERCLI_WORKER_UID: ${OVERCLI_WORKER_UID-1001}
    # What a worker's run may do without a person. Widen deliberately; external
    # actions (push, send, publish) still stop for the manager's approval in
    # Slack unless the worker is trusted with them.
    command:
      - serve
      - --permissions
      - allow-list
      - --allow-tool
      - Read,Glob,Grep,Edit,Write,WebSearch,WebFetch
      # The most an admin may allow from the console (Setup → Workers →
      # Permissions): read, standard, shell (listed commands) or everything.
      - --max-access
      - shell
    # Everything that matters lives in /data. Leave OVERCLI_DATA unset for a
    # Docker volume, or set it to a path on a durable disk (an EBS volume, a
    # GCE persistent disk) owned by uid 1000. See deploy/aws.md, deploy/gcp.md.
    volumes:
      - ${OVERCLI_DATA:-overcli-data}:/data
    # Loopback only: reach the console over an SSH tunnel or the VPN host's
    # reverse proxy. Change to "7420:7420" only behind a firewall, and then
    # drop OVERCLI_PUBLISHED_ON_LOOPBACK above.
    ports:
      - "127.0.0.1:7420:7420"
      # Prometheus metrics: set OVERCLI_METRICS=0.0.0.0:9464 (and, outside one
      # team's network, OVERCLI_METRICS_TOKEN) in .env, then publish the port.
      # - "127.0.0.1:9464:9464"

volumes:
  overcli-data:
