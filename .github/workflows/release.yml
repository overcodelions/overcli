name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read   # least privilege at the top; the publish job elevates itself

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is pinned rather than `macos-latest`: the macos-26 image that
        # rolled on 2026-08-31 (20260831.0337) fails signing at
        # `security set-key-partition-list` with "SecKeychainUnlock: the user
        # name or passphrase you entered is not correct" — the temp keychain
        # electron-builder creates no longer unlocks with the password it was
        # created with. Nothing in the certificate or the Apple secrets changed:
        # the same secrets signed 0.17.0 on the previous image (20260728.0273),
        # and the import step still succeeds on the new one. electron-builder is
        # already on its latest stable (26.15.3), so there is no version to bump
        # to. Revisit when a later macos-26 image or electron-builder release
        # fixes it; until then this builds on the last image that works.
        os: [macos-15, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile main + renderer
        run: npm run build

      - name: Fetch the Intel esbuild binary (macOS)
        # esbuild ships its binary as per-platform optional packages and npm
        # installs only the one matching the runner. The runner is arm64, so
        # without this the x64 dmg carries an arm64 esbuild and the React
        # preview (src/main/reactPreviewBundle.ts) dies on Intel with
        # "you installed esbuild for another platform". Both variants can sit
        # in node_modules together; esbuild picks by process.arch at runtime.
        # --force is required because npm refuses a foreign-cpu package.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ESBUILD_VERSION=$(node -p "require('./node_modules/esbuild/package.json').version")
          npm i --no-save --force "@esbuild/darwin-x64@${ESBUILD_VERSION}"
          test -d node_modules/@esbuild/darwin-x64
          ls node_modules/@esbuild

      - name: Package with electron-builder
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "Apple credentials detected — building signed + notarized."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "No Apple credentials in repo secrets — building unsigned."
          fi
          npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: overcli-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation (OIDC)
      attestations: write    # store the provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create stable-named copies
        # Permanent, version-free filenames so overcli.app and the README can
        # link at /releases/latest/download/<name> and never go stale.
        shell: bash
        run: |
          mkdir -p stable
          shopt -s nullglob
          cd artifacts
          for f in *; do
            case "$f" in
              *arm64*mac*.zip)  cp "$f" "../stable/Overcli-mac-arm64.zip" ;;
              *arm64.dmg)       cp "$f" "../stable/Overcli-mac-arm64.dmg" ;;
              *mac*.zip)        cp "$f" "../stable/Overcli-mac-x64.zip" ;;
              *.dmg)            cp "$f" "../stable/Overcli-mac-x64.dmg" ;;
              *arm64*.exe)      cp "$f" "../stable/Overcli-win-arm64.exe" ;;
              *Setup*.exe)      cp "$f" "../stable/Overcli-win-x64.exe" ;;
              *arm64.AppImage)  cp "$f" "../stable/Overcli-linux-arm64.AppImage" ;;
              *.AppImage)       cp "$f" "../stable/Overcli-linux-x64.AppImage" ;;
              *arm64.deb)       cp "$f" "../stable/Overcli-linux-arm64.deb" ;;
              *amd64.deb)       cp "$f" "../stable/Overcli-linux-x64.deb" ;;
            esac
          done
          ls -la ../stable

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS.txt || true
          echo "Checksums:" && cat SHA256SUMS.txt

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/overcli-sbom.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb

      - name: Compose release notes
        # The table is generated from what actually built. If an arch fails to
        # package, its row is omitted rather than shipping a dead link.
        shell: bash
        run: |
          row () {  # $1 = label, $2... = filenames
            local label="$1"; shift
            local links=() f
            for f in "$@"; do
              [ -f "stable/$f" ] || continue
              links+=("[\`${f##*.}\`](https://github.com/${{ github.repository }}/releases/latest/download/$f)")
            done
            [ ${#links[@]} -eq 0 ] && return 0
            local joined="${links[0]}" i
            for ((i = 1; i < ${#links[@]}; i++)); do joined+=" · ${links[i]}"; done
            echo "| $label | $joined |" >> notes.md
          }
          {
            echo "## Download"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
          } > notes.md
          row "**macOS** · Apple Silicon" Overcli-mac-arm64.dmg Overcli-mac-arm64.zip
          row "**macOS** · Intel"        Overcli-mac-x64.dmg   Overcli-mac-x64.zip
          row "**Windows** · x64"        Overcli-win-x64.exe
          row "**Windows** · ARM64"      Overcli-win-arm64.exe
          row "**Linux** · x64"          Overcli-linux-x64.AppImage   Overcli-linux-x64.deb
          row "**Linux** · ARM64"        Overcli-linux-arm64.AppImage Overcli-linux-arm64.deb
          cat >> notes.md <<'EOF'

          macOS builds are signed and notarized. Windows builds are not yet signed —
          SmartScreen warns on first run: **More info → Run anyway**. The Linux
          AppImage needs `chmod +x` before it will run.

          The `latest*.yml` files in the asset list are auto-updater metadata, not
          downloads. `SHA256SUMS.txt` and the CycloneDX SBOM are for verification.

          ---
          EOF
          cat notes.md

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          draft: true
          generate_release_notes: true
          body_path: notes.md
          files: |
            artifacts/*
            stable/*

  npm:
    name: Publish CLI to npm
    # Independent of the desktop build: the CLI is `dist/cli` + `dist/main` +
    # `dist/shared` and needs no electron packaging. Keeping it off `needs:`
    # means a signing failure on one OS does not also hold back the CLI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # publish to GitHub Packages
      id-token: write        # provenance, same OIDC trust as the release job
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: npm
          # GitHub Packages while the CLI is private. Going public later means
          # this line, publishConfig in package.json, and the auth lines in the
          # generated pipelines — CI_CLI_REGISTRY in src/shared/flows/ciDeploy.ts.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@overcodelions'

      - run: npm ci

      # `prepublishOnly` also builds, but doing it here means a broken build
      # fails on its own step rather than inside publish.
      - name: Compile the CLI
        run: npm run build:main

      - name: Check the tarball is only the CLI
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -qE 'npm notice.*(src/|\.test\.js)' /tmp/pack.txt; then
            echo "::error::Tarball contains source or tests — check the `files` allowlist in package.json"
            exit 1
          fi

      - name: Publish
        # Always the `alpha` dist-tag, never `latest`, so `npm i -g overcli`
        # cannot pick up a CLI whose deploy surface is still flagged Alpha in
        # the app. The generated pipelines install `overcli@alpha` to match —
        # see CI_CLI_TAG in src/shared/flows/ciDeploy.ts. Flip both together
        # when it graduates.
        # `--access restricted` while it is private; publishConfig says the
        # same thing, and both move together when it goes public. No NPM_TOKEN
        # secret needed — GITHUB_TOKEN can write packages in this org.
        run: npm publish --tag alpha --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
