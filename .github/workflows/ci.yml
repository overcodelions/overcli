name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: node -e "const p=require('./package.json'), l=require('./package-lock.json'); if (p.version !== l.version || p.version !== l.packages[''].version) { console.error('Version mismatch: package.json=' + p.version + ', package-lock.json=' + l.version + ', package-lock root=' + l.packages[''].version); process.exit(1); }"

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
