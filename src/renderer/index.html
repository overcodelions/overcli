<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'; connect-src 'self' ws://localhost:5173 http://localhost:5173; frame-src 'self' data: file: overcli-preview:; object-src 'self' data: file:; base-uri 'self'" />
    <title>overcli</title>
    <!-- Launch screen: shown inside #root until React mounts and replaces it
         (the dev server can take a few seconds to serve the first bundle).
         Pure CSS/SVG because the CSP disallows inline scripts. -->
    <link rel="stylesheet" href="./boot.css" />
  </head>
  <body class="bg-surface text-ink antialiased font-sans select-none">
    <div id="root">
      <div class="boot" role="status" aria-label="Starting overcli">
        <div class="boot__lockup">
          <span class="boot__line"></span>
          <svg class="boot__prompt" viewBox="0 0 300 290" aria-hidden="true">
            <polyline pathLength="1" points="29,29 271,145 29,261" />
          </svg>
          <span class="boot__name">overcli</span>
        </div>
        <div class="boot__version">Version %VITE_APP_VERSION%</div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
